<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photo Wall — Lex Liga</title>
  <meta name="theme-color" content="#0b1120" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/extras.css" />
  <link rel="manifest" href="manifest.json" />
  <style>
    .gallery-grid {
      columns: 1;
      column-gap: 1rem;
    }
    @media (min-width: 640px) { .gallery-grid { columns: 2; } }
    @media (min-width: 1024px) { .gallery-grid { columns: 3; } }
    .gallery-item {
      break-inside: avoid;
      margin-bottom: 1rem;
      border-radius: 1rem;
      overflow: hidden;
      border: 1px solid rgba(148,163,184,0.15);
      background: #0f172a;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .gallery-item:hover { transform: translateY(-3px); }
    .gallery-item img {
      width: 100%;
      display: block;
      vertical-align: middle;
    }
    .lightbox {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(0,0,0,0.9);
      display: none; align-items: center; justify-content: center;
      padding: 1rem;
    }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 95vw; max-height: 90vh; border-radius: 0.5rem; }
    .lightbox-close {
      position: absolute; top: 1rem; right: 1rem;
      width: 44px; height: 44px; border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.3); background: rgba(0,0,0,0.5);
      color: #fff; font-size: 1.25rem; cursor: pointer;
    }
  </style>
</head>
<body class="min-h-screen">
  <header class="site-header sticky top-0 z-50"></header>

  <main class="max-w-6xl mx-auto px-4 sm:px-6 py-10">
    <p class="section-eyebrow">MATCHDAY MOMENTS</p>
    <h1 class="text-2xl font-extrabold mb-2">Photo Wall</h1>
    <p class="text-slate-400 text-sm mb-8">Moments from Lex Liga — refreshed as new photos are added.</p>
    <div id="gallery" class="gallery-grid">
      <p class="text-slate-400 text-sm">Loading photos…</p>
    </div>
  </main>

  <div id="lightbox" class="lightbox" onclick="if(event.target===this)closeLb()">
    <button type="button" class="lightbox-close" onclick="closeLb()">✕</button>
    <img id="lightboxImg" src="" alt="" />
  </div>

  <footer class="site-footer">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-8">
      <div class="footer-content">
        <div class="footer-credit-block"><span class="footer-label">Created by</span><strong class="footer-name">Jatin Narula</strong></div>
        <div class="footer-credit-block"><span class="footer-label">Managed by</span><strong class="footer-name">Sports & Cultural Committee</strong><span class="footer-subtext">(SACC), SLFJPS, NFSU</span></div>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/mobile-nav.js"></script>
  <script src="js/announce.js"></script>
  <script src="js/pwa-register.js"></script>
  <script>
    var BUCKET = 'gallery';

    function openLb(src) {
      document.getElementById('lightboxImg').src = src;
      document.getElementById('lightbox').classList.add('open');
    }
    function closeLb() {
      document.getElementById('lightbox').classList.remove('open');
    }

    function publicUrl(path) {
      var sb = window.supabaseClient;
      if (!sb || !sb.storage) return '';
      var r = sb.storage.from(BUCKET).getPublicUrl(path);
      return (r && r.data && r.data.publicUrl) || '';
    }

    async function loadGallery() {
      var el = document.getElementById('gallery');
      var sb = window.supabaseClient;
      if (!sb || !sb.storage) {
        el.innerHTML = '<p class="text-slate-400 text-sm">Photos will appear here during the event.</p>';
        return;
      }
      try {
        var res = await sb.storage.from(BUCKET).list('', {
          limit: 200,
          sortBy: { column: 'created_at', order: 'desc' }
        });
        if (res.error) throw res.error;
        var files = (res.data || []).filter(function (f) {
          return f.name && /\.(jpe?g|png|gif|webp)$/i.test(f.name);
        });
        if (!files.length) {
          el.innerHTML = '<p class="text-slate-400 text-sm">Photos will appear here during the event.</p>';
          return;
        }
        el.innerHTML = files.map(function (f) {
          var url = publicUrl(f.name);
          var safe = String(f.name).replace(/"/g, '');
          return '<div class="gallery-item" onclick="openLb(\'' + url.replace(/'/g, "%27") + '\')">' +
            '<img src="' + url + '" alt="' + safe + '" loading="lazy" />' +
            '</div>';
        }).join('');
      } catch (e) {
        console.error(e);
        el.innerHTML = '<p class="text-slate-400 text-sm">Photos will appear here during the event.</p>';
      }
    }
    loadGallery();
    setInterval(loadGallery, 30000);
  </script>
</body>
</html>
