<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teams – Lex Liga 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/extras.css" />
  <link rel="manifest" href="manifest.json" />
  <style>
    .team-card {
      background: rgba(15,23,42,0.85);
      border: 1px solid rgba(148,163,184,0.15);
      border-radius: 1.25rem;
      padding: 1.25rem 1.35rem;
    }
    .team-card h3 { font-size: 1.05rem; font-weight: 800; color: #f1f5f9; margin-bottom: 0.65rem; }
    .team-card ul { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .team-card li {
      font-size: 0.8rem; color: #cbd5e1;
      background: rgba(30,41,59,0.9);
      border: 1px solid rgba(51,65,85,0.8);
      border-radius: 999px;
      padding: 0.25rem 0.65rem;
    }
    .cat-title {
      font-size: 0.7rem; font-weight: 800; letter-spacing: 0.12em;
      text-transform: uppercase; color: #4ade80; margin: 1.75rem 0 0.85rem;
    }
    .cat-title:first-of-type { margin-top: 0.5rem; }
  </style>
</head>
<body class="min-h-screen">
  <header class="site-header sticky top-0 z-50"></header>

  <section class="hero-shell hero-shell-compact">
    <div class="hero-grid"></div>
    <div class="hero-glow hero-glow-one"></div>
    <div class="hero-content max-w-6xl mx-auto px-4 sm:px-6">
      <div class="hero-copy">
        <div class="hero-kicker"><span class="hero-live-dot"></span> ROSTERS · 2026</div>
        <h1>TEAMS</h1>
        <p class="hero-title">WHO'S PLAYING</p>
        <div class="hero-divider"></div>
        <div class="hero-meta"><span>FUTSAL</span><span>•</span><span>BADMINTON</span></div>
      </div>
    </div>
  </section>

  <main class="max-w-6xl mx-auto px-4 sm:px-6 py-8 space-y-10 pb-24">
    <section>
      <p class="section-eyebrow">⚽ FUTSAL</p>
      <h2 class="text-2xl font-extrabold mb-4">Men's Teams</h2>
      <div class="grid sm:grid-cols-2 gap-4" id="futsalMen"></div>
      <p class="cat-title">Women's Squad</p>
      <div class="team-card" id="futsalWomen"></div>
    </section>

    <section>
      <p class="section-eyebrow">🏸 BADMINTON</p>
      <h2 class="text-2xl font-extrabold mb-2">Entries</h2>
      <p class="text-sm text-slate-400 mb-4">Knock-out from round 1 · categories as registered</p>
      <div id="bmEntries"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-8">
      <div class="footer-content">
        <div class="footer-credit-block">
          <span class="footer-label">Created by</span>
          <strong class="footer-name">Jatin Narula</strong>
        </div>
        <div class="footer-credit-block">
          <span class="footer-label">Managed by</span>
          <strong class="footer-name">Sports &amp; Cultural Committee</strong>
          <span class="footer-subtext">(SACC), SLFJPS, NFSU</span>
        </div>
      </div>
    </div>
  </footer>
  <script src="js/mobile-nav.js"></script>
  <script src="js/teams-data.js"></script>
</body>
</html>
