<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Knockout Bracket — Lex Liga</title>
  <meta name="theme-color" content="#0b1120" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/extras.css" />
  <link rel="manifest" href="manifest.json" />
  <style>
    .bracket-round { min-width: 200px; }
    .bracket-card {
      background: rgba(15,23,42,0.9);
      border: 1px solid rgba(148,163,184,0.2);
      border-radius: 0.75rem;
      padding: 0.75rem 1rem;
      margin-bottom: 1rem;
    }
    .bracket-card.live { border-color: rgba(239,68,68,0.5); }
    .bracket-card.done { border-color: rgba(34,197,94,0.35); }
    .bracket-scroll {
      display: flex; gap: 1.5rem; overflow-x: auto; padding-bottom: 1rem;
    }
  </style>
</head>
<body class="min-h-screen">
  <header class="site-header sticky top-0 z-50"></header>

  <main class="max-w-6xl mx-auto px-4 sm:px-6 py-10 space-y-10">
    <div>
      <p class="section-eyebrow">KNOCKOUT</p>
      <h1 class="text-2xl font-extrabold">Tournament Bracket</h1>
      <p class="text-slate-400 text-sm mt-1">Quarter-finals · Semi-finals · Final</p>
    </div>

    <section>
      <h2 class="font-bold text-lg mb-4">⚽ Futsal</h2>
      <div id="bracketFutsal" class="bracket-scroll"><p class="text-slate-400 text-sm">Loading…</p></div>
    </section>

    <section>
      <h2 class="font-bold text-lg mb-4">🏸 Badminton</h2>
      <div id="bracketBm" class="bracket-scroll"><p class="text-slate-400 text-sm">Loading…</p></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-8">
      <div class="footer-content">
        <div class="footer-credit-block"><span class="footer-label">Created by</span><strong class="footer-name">Jatin Narula</strong></div>
        <div class="footer-credit-block"><span class="footer-label">Managed by</span><strong class="footer-name">Sports & Cultural Committee</strong><span class="footer-subtext">(SACC), SLFJPS, NFSU</span></div>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-config.js"></script>
  <script>
    var sb = window.supabaseClient;

    function stageOf(text) {
      var t = (text || '').toUpperCase();
      if (t.indexOf('FINAL') >= 0 && t.indexOf('SEMI') < 0) return 'Final';
      if (t.indexOf('SF') >= 0 || t.indexOf('SEMI') >= 0) return 'Semi-finals';
      if (t.indexOf('QF') >= 0 || t.indexOf('QUARTER') >= 0) return 'Quarter-finals';
      return null;
    }

    function card(html, status) {
      var cls = 'bracket-card';
      if (status === 'live' || status === 'half_time') cls += ' live';
      if (status === 'finished' || status === 'walkover') cls += ' done';
      return '<div class="' + cls + '">' + html + '</div>';
    }

    function renderRounds(elId, matches, renderOne) {
      var el = document.getElementById(elId);
      var order = ['Quarter-finals', 'Semi-finals', 'Final'];
      var by = {};
      matches.forEach(function (m) {
        var s = stageOf(m.group_name || m.category || m.stage);
        if (!s) return;
        if (!by[s]) by[s] = [];
        by[s].push(m);
      });
      var html = order.map(function (round) {
        var list = by[round] || [];
        if (!list.length) return '';
        return '<div class="bracket-round"><h3 class="text-sm font-bold text-green-400 mb-3">' + round + '</h3>' +
          list.map(function (m) { return card(renderOne(m), m.status); }).join('') +
          '</div>';
      }).join('');
      el.innerHTML = html || '<p class="text-slate-400 text-sm">Knockout matches will appear here once the stage begins.</p>';
    }

    var DEMO_FUTSAL = [
      { stage: 'QF', group_name: 'QF 1', status: 'finished', home: 'Law Lions', away: 'Code Crushers', home_score: 4, away_score: 2 },
      { stage: 'QF', group_name: 'QF 2', status: 'finished', home: 'Statute FC', away: 'Bailiff Ballers', home_score: 1, away_score: 3 },
      { stage: 'QF', group_name: 'QF 3', status: 'finished', home: 'Moot Masters', away: 'Gavel United', home_score: 5, away_score: 5 },
      { stage: 'QF', group_name: 'QF 4', status: 'finished', home: 'Section 11', away: 'Lex FC', home_score: 2, away_score: 0 },
      { stage: 'SF', group_name: 'SF 1', status: 'live', home: 'Law Lions', away: 'Bailiff Ballers', home_score: 2, away_score: 2 },
      { stage: 'SF', group_name: 'SF 2', status: 'not_started', home: 'Moot Masters', away: 'Section 11', home_score: 0, away_score: 0 },
      { stage: 'Final', group_name: 'Final', status: 'not_started', home: 'TBD', away: 'TBD', home_score: 0, away_score: 0 }
    ];

    var DEMO_BM = [
      { category: 'QF · MS', status: 'finished', player1: 'Aarav Sharma', player2: 'Rohan Patel', games_p1: 2, games_p2: 0 },
      { category: 'QF · MS', status: 'finished', player1: 'Vikram Singh', player2: 'Kabir Mehta', games_p1: 2, games_p2: 1 },
      { category: 'SF · MS', status: 'live', player1: 'Aarav Sharma', player2: 'Vikram Singh', games_p1: 1, games_p2: 1 },
      { category: 'Final · MS', status: 'not_started', player1: 'TBD', player2: 'TBD', games_p1: 0, games_p2: 0 },
      { category: 'SF · WS', status: 'finished', player1: 'Priya Mehta', player2: 'Ananya Singh', games_p1: 2, games_p2: 1 },
      { category: 'Final · WS', status: 'not_started', player1: 'Priya Mehta', player2: 'TBD', games_p1: 0, games_p2: 0 }
    ];

    function showDemo() {
      renderRounds('bracketFutsal', DEMO_FUTSAL, function (m) {
        return '<div class="text-xs text-slate-500 mb-1">' + (m.group_name || '') + '</div>' +
          '<div class="font-semibold text-sm">' + m.home + ' <span class="text-slate-400">' + m.home_score + '</span></div>' +
          '<div class="font-semibold text-sm">' + m.away + ' <span class="text-slate-400">' + m.away_score + '</span></div>';
      });
      renderRounds('bracketBm', DEMO_BM, function (m) {
        return '<div class="text-xs text-slate-500 mb-1">' + (m.category || '') + '</div>' +
          '<div class="font-semibold text-sm">' + m.player1 + ' <span class="text-slate-400">' + m.games_p1 + '</span></div>' +
          '<div class="font-semibold text-sm">' + m.player2 + ' <span class="text-slate-400">' + m.games_p2 + '</span></div>';
      });
    }

    async function load() {
      if (!sb || typeof sb.from !== 'function') {
        showDemo();
        return;
      }
      var teams = {};
      try {
        var tr = await sb.from('teams').select('*');
        (tr.data || []).forEach(function (t) { teams[t.id] = t.name; });
      } catch (e) {}

      var fr = await sb.from('matches').select('*');
      var fm = (fr.data || []).filter(function (m) { return stageOf(m.group_name); });

      var br = await sb.from('badminton_matches').select('*');
      var bm = (br.data || []).filter(function (m) { return stageOf(m.category); });

      if (!fm.length && !bm.length) {
        showDemo();
        return;
      }

      if (fm.length) {
        renderRounds('bracketFutsal', fm, function (m) {
          var h = teams[m.home_team_id] || 'TBD';
          var a = teams[m.away_team_id] || 'TBD';
          return '<div class="text-xs text-slate-500 mb-1">' + (m.group_name || '') + '</div>' +
            '<div class="font-semibold text-sm">' + h + ' <span class="text-slate-400">' + (m.home_score ?? 0) + '</span></div>' +
            '<div class="font-semibold text-sm">' + a + ' <span class="text-slate-400">' + (m.away_score ?? 0) + '</span></div>';
        });
      } else {
        renderRounds('bracketFutsal', DEMO_FUTSAL, function (m) {
          return '<div class="text-xs text-slate-500 mb-1">' + (m.group_name || '') + '</div>' +
            '<div class="font-semibold text-sm">' + m.home + ' <span class="text-slate-400">' + m.home_score + '</span></div>' +
            '<div class="font-semibold text-sm">' + m.away + ' <span class="text-slate-400">' + m.away_score + '</span></div>';
        });
      }

      if (bm.length) {
        renderRounds('bracketBm', bm, function (m) {
          return '<div class="text-xs text-slate-500 mb-1">' + (m.category || '') + '</div>' +
            '<div class="font-semibold text-sm">' + (m.player1 || 'TBD') + ' <span class="text-slate-400">' + (m.games_p1 || 0) + '</span></div>' +
            '<div class="font-semibold text-sm">' + (m.player2 || 'TBD') + ' <span class="text-slate-400">' + (m.games_p2 || 0) + '</span></div>';
        });
      } else {
        renderRounds('bracketBm', DEMO_BM, function (m) {
          return '<div class="text-xs text-slate-500 mb-1">' + (m.category || '') + '</div>' +
            '<div class="font-semibold text-sm">' + m.player1 + ' <span class="text-slate-400">' + m.games_p1 + '</span></div>' +
            '<div class="font-semibold text-sm">' + m.player2 + ' <span class="text-slate-400">' + m.games_p2 + '</span></div>';
        });
      }
    }

    load();
    setInterval(load, 20000);
  </script>
</body>
</html>
